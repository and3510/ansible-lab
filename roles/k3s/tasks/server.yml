---
- name: Gerar configuracao do server
  ansible.builtin.template:
    src: server-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Reiniciar k3s

- name: Instalar k3s server
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server
  args:
    creates: /usr/local/bin/k3s
  # O instalador bloqueia ate o servico ficar pronto; sem limite, um node
  # que nao consegue entrar no cluster trava o playbook para sempre.
  timeout: 300

- name: Aguardar API do Kubernetes
  ansible.builtin.wait_for:
    host: "{{ k3s_node_ip }}"
    port: "{{ k3s_api_port }}"
    timeout: 300

- name: Aguardar geracao do token do cluster
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

- name: Ler token do cluster
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token_file
  no_log: true
  when: k3s_token is not defined

- name: Disponibilizar token para os agents
  ansible.builtin.set_fact:
    k3s_generated_token: "{{ k3s_node_token_file.content | b64decode | trim }}"
  no_log: true
  when: k3s_token is not defined
