---
- name: Aguardar todos os nos ficarem Ready
  ansible.builtin.command: >-
    k3s kubectl wait node --all --for=condition=Ready --timeout=300s
  changed_when: false

- name: Listar nos do cluster
  ansible.builtin.command: k3s kubectl get nodes -o wide
  register: k3s_nodes
  changed_when: false

- name: Exibir nos do cluster
  ansible.builtin.debug:
    var: k3s_nodes.stdout_lines

- name: Exportar kubeconfig para a maquina de controle
  when: k3s_fetch_kubeconfig | bool
  block:
    - name: Ler kubeconfig do server
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true

    - name: Criar diretorio local de artefatos
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_local_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Salvar kubeconfig apontando para o IP do server
      ansible.builtin.copy:
        content: >-
          {{ k3s_kubeconfig.content | b64decode
             | replace('https://127.0.0.1:' ~ k3s_api_port, k3s_server_url) }}
        dest: "{{ k3s_kubeconfig_local_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Informar caminho do kubeconfig
      ansible.builtin.debug:
        msg: "export KUBECONFIG={{ k3s_kubeconfig_local_path | realpath }}"
