---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Pacotes da distro que conflitam com o Docker CE oficial.
docker_conflicting_packages:
  - docker.io
  - docker-doc
  - docker-compose
  - podman-docker
  - containerd
  - runc

docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64
docker_apt_arch: "{{ docker_apt_arch_map[ansible_architecture] | default(ansible_architecture) }}"
docker_repo_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"

# Usuarios adicionados ao grupo docker.
# Atencao: o grupo docker equivale a acesso root no host.
docker_users: []

# Renderizado em /etc/docker/daemon.json
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
  live-restore: true
