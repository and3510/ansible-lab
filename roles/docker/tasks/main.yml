---
- name: Remover pacotes conflitantes
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

- name: Criar diretorio de keyrings do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Baixar chave GPG do repositorio Docker
  ansible.builtin.get_url:
    url: "{{ docker_repo_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    timeout: 60
  register: docker_gpg_key
  until: docker_gpg_key is succeeded
  retries: 3
  delay: 5

- name: Adicionar repositorio oficial do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_repo_url }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Instalar Docker Engine e plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Configurar daemon do Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar Docker

- name: Garantir Docker iniciado e habilitado no boot
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Adicionar usuarios ao grupo docker
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Validar instalacao
  ansible.builtin.command: docker version --format '{{ "{{" }} .Server.Version {{ "}}" }}'
  register: docker_version
  changed_when: false

- name: Exibir versao instalada
  ansible.builtin.debug:
    msg: "Docker {{ docker_version.stdout }} em {{ inventory_hostname }}"
