[defaults]
inventory = ./inventories/develop/hosts.ini

roles_path = ./roles

host_key_checking = False

retry_files_enabled = False

private_key_file = ~/.ssh/minha_chave_servidor.pem

interpreter_python = auto_silent

stdout_callback = yaml



[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

